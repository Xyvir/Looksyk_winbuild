name: Release Windows Installer

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: backend

      - name: Build frontend
        working-directory: frontend/looksyk
        run: |
          npm install
          npm run build --configuration=production

      - name: Build backend
        working-directory: ./backend
        run: cargo build --release

      - name: Debug directory structure
        run: |
          Write-Host "--- Debug: Listing repository root content ---"
          Get-ChildItem -Path . -Depth 2
          Write-Host "--- End of debug output ---"

      - name: Package application wrapper
        working-directory: application-wrapper/Looksyk
        run: |
          if (Test-Path -Path "out") { Remove-Item -Recurse -Force "out" }
          npm install
          npm run package

      - name: Create target directory and copy artifacts
        run: |
          if (Test-Path -Path "target") { Remove-Item -Recurse -Force "target" }
          New-Item -ItemType Directory -Force -Path "target/static"
          New-Item -ItemType Directory -Force -Path "target/application-wrapper"
          Copy-Item -Path "backend/target/release/looksyk.exe" -Destination "target/"
          Copy-Item -Path "frontend/looksyk/dist/looksyk/browser/*" -Destination "target/static" -Recurse
          if [ -d "application-wrapper/Looksyk/out/looksyk-win32-x64" ]; then
            Copy-Item -Path "application-wrapper/Looksyk/out/looksyk-win32-x64/*" -Destination "target/application-wrapper" -Recurse
          else
            Write-Warning "Could not find 'application-wrapper/Looksyk/out/looksyk-win32-x64'"
            Get-ChildItem -Path "application-wrapper/Looksyk/out" -Recurse
          fi


      - name: Make Windows installer
        env:
          # This secret should be configured in your repository settings
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          cd application-wrapper/Looksyk
          npm install --save-dev @electron-forge/maker-squirrel
          npm run make -- --platform=win32 --arch=x64

      - name: Upload Windows Installer to Release
        run: |
          $release_tag = "${{ github.ref_name }}"
          $asset_path = "application-wrapper/Looksyk/out/make/squirrel.windows/x64/*"
          Get-ChildItem -Path $asset_path | ForEach-Object { gh release upload $release_tag $_.FullName --clobber }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}